[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "forge-incident"
version = "0.3.1"
description = "Evidence-grounded incident triage and root cause analysis workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "langgraph>=0.6,<1",
]

[project.optional-dependencies]
context = [
  "forge-context @ git+https://github.com/MDowlen/forge-context.git@30a7670355e02b8d1471b924708cbaf0d7094647",
]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
  "forge-context @ git+https://github.com/MDowlen/forge-context.git@30a7670355e02b8d1471b924708cbaf0d7094647",
]

[project.scripts]
forge-incident = "forge_incident.cli:app"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/forge_incident"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008"]
